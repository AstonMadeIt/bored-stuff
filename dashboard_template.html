<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Prediction Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #2a5298;
        }
        .stat-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .section {
            padding: 40px;
            border-top: 1px solid #eee;
        }
        .section-title {
            font-size: 1.8em;
            margin-bottom: 25px;
            color: #1e3c72;
        }
        .game-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #2a5298;
        }
        .game-card.high-conf { border-left-color: #28a745; background: #f0fff4; }
        .teams { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; }
        .loading { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏈🏀 Multi-Sport Prediction Dashboard</h1>
            <p id="timestamp">Loading...</p>
        </div>
        
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="upcoming">-</div>
                <div class="stat-label">Upcoming Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="high-conf">-</div>
                <div class="stat-label">High Confidence</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completed">-</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="accuracy">-</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="high-acc">-</div>
                <div class="stat-label">High Conf Accuracy</div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">🎯 High-Confidence Predictions</div>
            <div id="upcoming-games" class="loading">Loading predictions...</div>
        </div>
        
        <div class="section">
            <div class="section-title">✅ Recent Results</div>
            <div id="completed-games" class="loading">Loading results...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        
        async         function loadData() {
            // Update timestamp
            document.getElementById('timestamp').textContent = 
                `Last updated: ${new Date().toLocaleString()}`;
            
            // Load metrics
            try {
                const metricsRes = await fetch(`${API_BASE}/api/metrics`);
                const metrics = await metricsRes.json();
                if (metrics.success) {
                    const m = metrics.data;
                    document.getElementById('upcoming').textContent = 
                        document.getElementById('upcoming').textContent || '-';
                    document.getElementById('completed').textContent = m.total_predictions || 0;
                    document.getElementById('accuracy').textContent = 
                        (m.accuracy || 0).toFixed(1) + '%';
                    document.getElementById('high-acc').textContent = 
                        (m.high_conf_accuracy || 0).toFixed(1) + '%';
                }
            } catch (e) {
                console.error('Error loading metrics:', e);
            }
            
            // Load high-confidence predictions (all sports)
            try {
                const predRes = await fetch(`${API_BASE}/api/predictions/high-confidence`);
                const preds = await predRes.json();
                if (preds.success) {
                    document.getElementById('high-conf').textContent = preds.count || 0;
                    renderPredictions(preds.data);
                }
            } catch (e) {
                console.error('Error loading predictions:', e);
            }
            
            // Load completed games (all sports)
            try {
                const resultsRes = await fetch(`${API_BASE}/api/results/completed`);
                const results = await resultsRes.json();
                if (results.success) {
                    renderResults(results.data.slice(0, 10));
                }
            } catch (e) {
                console.error('Error loading results:', e);
            }
        }
        
        function renderPredictions(predictions) {
            const container = document.getElementById('upcoming-games');
            if (!predictions || predictions.length === 0) {
                container.innerHTML = '<div class="loading">No high-confidence predictions available</div>';
                return;
            }
            
            container.innerHTML = predictions.map(p => {
                const sportIcon = p.sport === 'NBA' ? '🏀' : '🏈';
                return `
                <div class="game-card high-conf">
                    <div class="teams">${sportIcon} ${p.away_team} @ ${p.home_team}</div>
                    <div><strong>Predicted:</strong> ${p.predicted_winner} by ${Math.abs(p.predicted_spread).toFixed(1)}</div>
                    ${p.vegas_spread ? `<div><strong>Vegas:</strong> ${Math.abs(p.vegas_spread).toFixed(1)}</div>` : ''}
                    <div><strong>Confidence:</strong> ${(p.confidence_score * 100).toFixed(0)}%</div>
                </div>
            `;
            }).join('');
        }
        
        function renderResults(results) {
            const container = document.getElementById('completed-games');
            if (!results || results.length === 0) {
                container.innerHTML = '<div class="loading">No completed games yet</div>';
                return;
            }
            
            container.innerHTML = results.map(r => {
                const sportIcon = r.sport === 'NBA' ? '🏀' : '🏈';
                return `
                <div class="game-card ${r.prediction_correct ? 'high-conf' : ''}">
                    <div class="teams">${sportIcon} ${r.away_team} @ ${r.home_team}</div>
                    <div><strong>Predicted:</strong> ${r.predicted_winner} by ${Math.abs(r.predicted_spread).toFixed(1)}</div>
                    <div><strong>Actual:</strong> ${r.actual_winner} by ${Math.abs(r.actual_spread).toFixed(1)}</div>
                    <div><strong>Score:</strong> ${r.away_score} - ${r.home_score}</div>
                    <div><strong>Result:</strong> ${r.prediction_correct ? '✅ CORRECT' : '❌ INCORRECT'}</div>
                </div>
            `;
            }).join('');
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 5 minutes
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
